# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) ${{ matrix.config.is_arm64 && '(ARM64)' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: ubuntu-latest,   r: 'release', is_arm64: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Pandoc (Native)
        if: ${{ !matrix.config.is_arm64 }}
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R (Native)
        if: ${{ !matrix.config.is_arm64 }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Set up QEMU (ARM64 Emulation)
        if: ${{ matrix.config.is_arm64 }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Dependencies (Native)
        if: ${{ !matrix.config.is_arm64 }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::XML, any::roxygen2
          needs: check

      - name: Document (Native)
        if: ${{ !matrix.config.is_arm64 }}
        run: roxygen2::roxygenise(roclets = "rd")
        shell: Rscript {0}

      - name: Run R Check (Native)
        if: ${{ !matrix.config.is_arm64 }}
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Run R Check (ARM64 Emulation)
        if: ${{ matrix.config.is_arm64 }}
        env:
          USE_BUNDLED_LIBUV: 1
        run: |
          docker run --platform linux/arm64 --rm -v ${{ github.workspace }}:/pkg \
            ghcr.io/r-hub/r-minimal/r-minimal:latest \
            sh -c "apk update && apk add --no-cache bash build-base linux-headers libuv-dev && \
            R -e 'install.packages(c(\"remotes\", \"XML\", \"roxygen2\"), repos = \"https://cran.r-project.org/\")' && \
            R -e 'remotes::install_deps(\"/pkg\", dependencies = TRUE)' && \
            R -e 'roxygen2::roxygenise(\"/pkg\", roclets = \"rd\")' && \
            R CMD build /pkg && R CMD check --as-cran /*.tar.gz"
